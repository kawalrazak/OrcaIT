worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    server_tokens off;
    client_max_body_size 10m;

    upstream orcait { server web:3000; }
    upstream crm    { server crm:3001; }

    # Local dev: HTTP only (no TLS). Marketing site is the default.
    server {
        listen 80 default_server;
        server_name orcait.com.au www.orcait.com.au localhost 127.0.0.1 _;

        location / {
            proxy_pass         http://orcait;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    server {
        listen 80;
        server_name crm.orcait.com.au;

        location / {
            proxy_pass         http://crm;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
