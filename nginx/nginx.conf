worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    server_tokens off;
    client_max_body_size 10m;

    upstream orcait { server web:3000; }
    upstream crm    { server crm:3001; }
    # Keep facebook-bot optional at boot: resolve via Docker DNS + rewrite.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Marketing site HTTP ----
    server {
        listen 80 default_server;
        server_name orcait.com.au www.orcait.com.au localhost 127.0.0.1 _;

        location /facebook-webhook/ {
            rewrite ^/facebook-webhook/(.*)$ /$1 break;
            proxy_pass         http://facebook-bot:3002;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://orcait;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ---- CRM HTTP ----
    server {
        listen 80;
        server_name crm.orcait.com.au;

        location / {
            proxy_pass         http://crm;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # ---- Marketing site HTTPS ----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name orcait.com.au www.orcait.com.au;

        ssl_certificate     /etc/letsencrypt/live/orcait.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orcait.com.au/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location /facebook-webhook/ {
            rewrite ^/facebook-webhook/(.*)$ /$1 break;
            proxy_pass         http://facebook-bot:3002;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass         http://orcait;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }
    }

    # ---- CRM HTTPS ----
    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name crm.orcait.com.au;

        ssl_certificate     /etc/letsencrypt/live/orcait.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/orcait.com.au/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass         http://crm;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
