services:
  web:
    build:
      context: ./OrcaITWeb
    env_file:
      - ./OrcaITWeb/.env
    environment:
      CRM_INTERNAL_URL: http://crm:3001
    volumes:
      - orca_data:/app/data          # persists booking/chat-lead CSVs
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - crm
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  crm:
    build:
      context: ./CRM
    env_file:
      - ./CRM/.env
    environment:
      KEYCLOAK_URL: http://keycloak:8080/auth
      KEYCLOAK_REALM: orcait
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      - keycloak
    volumes:
      - crm_data:/app/data           # persists website leads for CRM
    restart: unless-stopped
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  facebook-bot:
    build:
      context: ./FacebookChatbot
    env_file:
      - ./FacebookChatbot/.env
    environment:
      CRM_INTERNAL_URL: http://crm:3001
    volumes:
      - facebook_bot_data:/app/data
    restart: unless-stopped
    expose:
      - "3002"
    depends_on:
      - crm

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: crm.orcait.com.au
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes/orcait:/opt/keycloak/themes/orcait:ro
    restart: unless-stopped
    expose:
      - "8080"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      crm:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"                  # enable once TLS certs are mounted below
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  orca_data:
  crm_data:
  facebook_bot_data:
  keycloak_data:
