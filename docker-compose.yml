services:
  web:
    build:
      context: ./OrcaITWeb
    env_file:
      - ./OrcaITWeb/.env
    environment:
      CRM_INTERNAL_URL: http://crm:3001
    volumes:
      - orca_data:/app/data          # persists booking/chat-lead CSVs
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - crm

  crm:
    build:
      context: ./CRM
    env_file:
      - ./CRM/.env
    volumes:
      - crm_data:/app/data           # persists website leads for CRM
    restart: unless-stopped
    expose:
      - "3001"

  legacy:
    build:
      context: .
      dockerfile: OrcaITLegacy/Dockerfile
    environment:
      CRM_INTERNAL_URL: http://crm:3001
    volumes:
      - legacy_data:/var/www/html/data
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - crm

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
      - crm
      - legacy
    ports:
      - "80:80"
      - "443:443"                  # enable once TLS certs are mounted below
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped

volumes:
  orca_data:
  crm_data:
  legacy_data:
